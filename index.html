<title>eJoagoz</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:ital,wght@1,600&display=swap">
<style>
/* Layout: top bar with the clock card at the left and the weather card at the right; logo and search centred below; settings button bottom right. */
:root {
  --bg: #1f2226;
  --surface: #26292e;
  --surface-hover: #2e3238;
  --fg: #fbfbfe;
  --muted: #9a9fa8;
  --line: #383c43;
  --accent: #b69cff;
  --accent-ink: #1c1730;
  --neon: #4eeaff;
  --neon-glow: rgba(78, 234, 255, .45);
  --font: "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
  --font-brand: "Chakra Petch", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #f9f9fb; --surface: #ffffff; --surface-hover: #f0f0f4;
    --fg: #15141a; --muted: #5b5b66; --line: #dcdce2;
    --accent: #6a3fd1; --accent-ink: #ffffff;
    --neon: #0a86a0; --neon-glow: rgba(10, 134, 160, .25); color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #f9f9fb; --surface: #ffffff; --surface-hover: #f0f0f4;
  --fg: #15141a; --muted: #5b5b66; --line: #dcdce2;
  --accent: #6a3fd1; --accent-ink: #ffffff;
  --neon: #0a86a0; --neon-glow: rgba(10, 134, 160, .25); color-scheme: light;
}

html, body { height: 100%; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font);
  padding-block: 20px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex;
  flex-direction: column;
  gap: 5vh;
  min-height: 100%;
  box-sizing: border-box;
}
.topbar { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; flex-wrap: wrap; }

/* Cards */
.card {
  width: 244px;
  max-width: 100%;
  background: var(--surface);
  border-radius: 12px;
  padding: 12px 14px 14px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  box-sizing: border-box;
}
.card-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.card-label { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.dots {
  appearance: none; border: 0; background: transparent; color: var(--muted);
  width: 28px; height: 28px; border-radius: 6px; cursor: pointer; font-size: 16px; line-height: 1;
  display: grid; place-items: center; flex: none;
}
.dots:hover { background: var(--surface-hover); color: var(--fg); }
.time { font-size: 38px; font-weight: 600; letter-spacing: -0.5px; font-variant-numeric: tabular-nums; line-height: 1; }
.time small { font-size: 15px; font-weight: 500; color: var(--muted); margin-left: 4px; letter-spacing: 0; }
.date { font-size: 12px; color: var(--muted); text-transform: capitalize; }
.picker { display: none; flex-direction: column; gap: 8px; }
.card.open .picker { display: flex; }
.picker input[type="search"], .picker select {
  width: 100%; box-sizing: border-box; font: inherit; font-size: 13px;
  background: var(--bg); color: var(--fg); border: 1px solid var(--line);
  border-radius: 6px; padding: 7px 8px;
}
.picker select { min-width: 0; }
.picker label.cap { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* Weather */
.wx-main { display: flex; align-items: center; gap: 12px; min-height: 40px; }
.wx-icon { width: 40px; height: 40px; border-radius: 10px; background: var(--surface-hover); display: grid; place-items: center; flex: none; }
.wx-icon svg { width: 24px; height: 24px; }
.ic-sun { color: #ffb13b; } .ic-moon { color: #c9d3ff; } .ic-cloud { color: #aab4c4; }
.ic-rain { color: #5aa9ff; } .ic-snow { color: #7fc4ff; } .ic-storm { color: #f2b620; } .ic-fog { color: #9aa3b0; }
.wx-temp { font-size: 22px; font-weight: 600; line-height: 1.1; font-variant-numeric: tabular-nums; }
.wx-range { font-size: 12px; color: var(--muted); display: flex; gap: 10px; font-variant-numeric: tabular-nums; }
.wx-desc { font-size: 12px; color: var(--muted); }
.wx-note { font-size: 11px; color: var(--muted); line-height: 1.35; }
.results { display: flex; flex-direction: column; max-height: 200px; overflow-y: auto; margin: 0 -4px; }
.results button {
  appearance: none; border: 0; background: transparent; color: var(--fg); font: inherit; font-size: 13px;
  text-align: left; padding: 7px 8px; border-radius: 6px; cursor: pointer;
}
.results button span { display: block; font-size: 11px; color: var(--muted); }
.results button:hover { background: var(--surface-hover); }
.units { display: flex; gap: 6px; }
.units button {
  flex: 1; appearance: none; border: 1px solid var(--line); background: transparent; color: var(--fg);
  font: inherit; font-size: 12px; padding: 5px 0; border-radius: 6px; cursor: pointer;
}
.units button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }

/* Centre */
main { display: flex; flex-direction: column; align-items: center; gap: 44px; padding-top: 2vh; }
.brand { display: flex; align-items: center; gap: 18px; }
.brand img {
  width: 92px; height: 92px; flex: none; border-radius: 50%; display: block;
  box-shadow: 0 0 24px var(--neon-glow);
}
.brand span {
  font-family: var(--font-brand); font-style: italic; font-weight: 600;
  font-size: 44px; letter-spacing: 0.5px; color: #0b2a6f;
  text-shadow: none;
}

.search {
  width: min(852px, 100%);
  display: flex; align-items: center; gap: 12px;
  background: var(--surface);
  border-radius: 24px;
  padding: 0 18px;
  height: 52px;
  box-sizing: border-box;
  box-shadow: 0 1px 4px rgba(0,0,0,.25);
}
.search:focus-within { outline: 2px solid var(--accent); }
.search svg { width: 20px; height: 20px; flex: none; color: var(--muted); }
.search input {
  flex: 1; min-width: 0; height: 100%;
  background: transparent; border: 0; outline: 0;
  color: var(--fg); font: inherit; font-size: 15px;
}
.search input::placeholder { color: var(--muted); }

/* Settings */
.fab-wrap { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; align-items: flex-end; gap: 10px; }
.fab {
  width: 32px; height: 32px; border-radius: 50%; border: 0; cursor: pointer;
  background: var(--accent); color: var(--accent-ink); display: grid; place-items: center;
}
.fab svg { width: 16px; height: 16px; }
.panel {
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
  padding: 12px 14px; display: none; flex-direction: column; gap: 10px; width: 220px; max-width: calc(100vw - 32px);
  box-sizing: border-box; box-shadow: 0 6px 24px rgba(0,0,0,.3);
}
.panel.open { display: flex; }
.panel h2 { margin: 0; font-size: 13px; font-weight: 600; }
.opt { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: 13px; }
.opt input { accent-color: var(--accent); width: 16px; height: 16px; }
@media (max-width: 560px) {
  .topbar > .card { width: 100%; }
  .brand img { width: 72px; height: 72px; }
  .brand span { font-size: 34px; }
  main { gap: 32px; }
}
@media (prefers-reduced-motion: no-preference) {
  .search, .dots, .fab { transition: background .15s, outline-color .15s; }
}
</style>

<div class="topbar">
  <div class="card" id="clock">
    <div class="card-top">
      <div class="card-label" id="zoneLabel">Madrid</div>
      <button class="dots" id="zoneBtn" type="button" aria-label="Cambiar zona horaria" aria-expanded="false" title="Cambiar zona horaria">···</button>
    </div>
    <div class="time" id="time" aria-live="off">--:--</div>
    <div class="date" id="date"></div>
    <div class="picker" id="picker">
      <label class="cap" for="zoneFilter">Buscar zona</label>
      <input id="zoneFilter" type="search" placeholder="Madrid, Tokio, New_York…" autocomplete="off">
      <label class="cap" for="zoneSelect">Zona horaria</label>
      <select id="zoneSelect"></select>
    </div>
  </div>

  <div class="card" id="weather">
    <div class="card-top">
      <div class="card-label" id="wxCity">Madrid</div>
      <button class="dots" id="wxBtn" type="button" aria-label="Cambiar población" aria-expanded="false" title="Cambiar población">···</button>
    </div>
    <div class="wx-main">
      <div class="wx-icon" id="wxIcon" aria-hidden="true"></div>
      <div>
        <div class="wx-temp" id="wxTemp">--°</div>
        <div class="wx-range" id="wxRange"></div>
      </div>
    </div>
    <div class="wx-desc" id="wxDesc"></div>
    <div class="picker" id="wxPicker">
      <label class="cap" for="wxSearch">Buscar población</label>
      <input id="wxSearch" type="search" placeholder="Escribe una población" autocomplete="off">
      <div class="results" id="wxResults"></div>
      <div class="units" role="group" aria-label="Unidad de temperatura">
        <button type="button" id="uC" aria-pressed="true">°C</button>
        <button type="button" id="uF" aria-pressed="false">°F</button>
      </div>
      <div class="wx-note" id="wxNote"></div>
    </div>
  </div>
</div>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  function load(key) { try { return JSON.parse(localStorage.getItem(key) || "null"); } catch (e) { return null; } }
  function store(key, v) { try { localStorage.setItem(key, JSON.stringify(v)); } catch (e) {} }

  /* ---------------- Clock ---------------- */
  var FALLBACK = ["Europe/Madrid","Europe/London","Europe/Paris","Europe/Berlin","Europe/Lisbon","Europe/Rome","Atlantic/Canary","America/New_York","America/Chicago","America/Denver","America/Los_Angeles","America/Mexico_City","America/Bogota","America/Lima","America/Santiago","America/Argentina/Buenos_Aires","America/Sao_Paulo","Africa/Cairo","Africa/Johannesburg","Asia/Dubai","Asia/Kolkata","Asia/Bangkok","Asia/Shanghai","Asia/Tokyo","Asia/Seoul","Australia/Sydney","Pacific/Auckland","UTC"];
  var zones;
  try { zones = Intl.supportedValuesOf("timeZone"); } catch (e) { zones = FALLBACK; }
  if (zones.indexOf("UTC") < 0) zones = zones.concat("UTC");
  var local = "Europe/Madrid";
  try { local = Intl.DateTimeFormat().resolvedOptions().timeZone || local; } catch (e) {}

  var state = { tz: local, h24: true, sec: false, date: true };
  var saved = load("startpage-clock");
  if (saved) {
    if (typeof saved.tz === "string" && zones.indexOf(saved.tz) >= 0) state.tz = saved.tz;
    ["h24", "sec", "date"].forEach(function (k) { if (typeof saved[k] === "boolean") state[k] = saved[k]; });
  }
  var timeEl = $("time"), dateEl = $("date"), labelEl = $("zoneLabel"), sel = $("zoneSelect");
  function cityName(tz) { return tz.split("/").pop().replace(/_/g, " "); }

  function fillSelect(filter) {
    var f = (filter || "").trim().toLowerCase().replace(/\s+/g, "_");
    var groups = {};
    zones.forEach(function (z) {
      if (f && z.toLowerCase().indexOf(f) < 0 && cityName(z).toLowerCase().indexOf(f.replace(/_/g, " ")) < 0) return;
      var g = z.indexOf("/") > 0 ? z.split("/")[0] : "Otras";
      (groups[g] = groups[g] || []).push(z);
    });
    sel.innerHTML = "";
    Object.keys(groups).forEach(function (g) {
      var og = document.createElement("optgroup"); og.label = g;
      groups[g].forEach(function (z) {
        var o = document.createElement("option");
        o.value = z; o.textContent = z.indexOf("/") > 0 ? z.split("/").slice(1).join(" / ").replace(/_/g, " ") : z;
        if (z === state.tz) o.selected = true;
        og.appendChild(o);
      });
      sel.appendChild(og);
    });
  }
  function offsetLabel(now) {
    try {
      var p = new Intl.DateTimeFormat("es-ES", { timeZone: state.tz, timeZoneName: "shortOffset" }).formatToParts(now);
      for (var i = 0; i < p.length; i++) if (p[i].type === "timeZoneName") return p[i].value;
    } catch (e) {}
    return "";
  }
  function tick() {
    var now = new Date();
    var opts = { timeZone: state.tz, hour: "2-digit", minute: "2-digit", hour12: !state.h24 };
    if (state.sec) opts.second = "2-digit";
    var parts = new Intl.DateTimeFormat("en-GB", opts).formatToParts(now);
    var main = "", ampm = "";
    parts.forEach(function (p) {
      if (p.type === "dayPeriod") ampm = p.value.toUpperCase();
      else if (p.type !== "literal" || main) main += p.value;
    });
    main = main.replace(/\s+$/, "");
    if (!state.h24) main = main.replace(/^0/, "");
    timeEl.textContent = main;
    if (ampm) { var s = document.createElement("small"); s.textContent = ampm; timeEl.appendChild(s); }
    dateEl.hidden = !state.date;
    dateEl.textContent = new Intl.DateTimeFormat("es-ES", { timeZone: state.tz, weekday: "long", day: "numeric", month: "long" }).format(now);
    var off = offsetLabel(now);
    labelEl.textContent = cityName(state.tz) + (off ? " · " + off : "");
  }
  var timer;
  function schedule() {
    clearTimeout(timer);
    timer = setTimeout(function () { tick(); schedule(); }, 1000 - (Date.now() % 1000) + 5);
  }
  var clock = $("clock"), zoneBtn = $("zoneBtn");
  zoneBtn.addEventListener("click", function () {
    var open = clock.classList.toggle("open");
    zoneBtn.setAttribute("aria-expanded", String(open));
    if (open) { fillSelect(""); $("zoneFilter").focus(); }
  });
  $("zoneFilter").addEventListener("input", function (e) { fillSelect(e.target.value); });
  sel.addEventListener("change", function () { state.tz = sel.value; store("startpage-clock", state); tick(); });

  /* ---------------- Weather ---------------- */
  var PRESETS = [
    { name: "Madrid", region: "España", lat: 40.4168, lon: -3.7038 },
    { name: "Barcelona", region: "España", lat: 41.3874, lon: 2.1686 },
    { name: "Valencia", region: "España", lat: 39.4699, lon: -0.3763 },
    { name: "Sevilla", region: "España", lat: 37.3891, lon: -5.9845 },
    { name: "Bilbao", region: "España", lat: 43.263, lon: -2.935 },
    { name: "Málaga", region: "España", lat: 36.7213, lon: -4.4214 },
    { name: "Lisboa", region: "Portugal", lat: 38.7223, lon: -9.1393 },
    { name: "París", region: "Francia", lat: 48.8566, lon: 2.3522 },
    { name: "Londres", region: "Reino Unido", lat: 51.5072, lon: -0.1276 },
    { name: "Roma", region: "Italia", lat: 41.9028, lon: 12.4964 },
    { name: "Berlín", region: "Alemania", lat: 52.52, lon: 13.405 },
    { name: "Nueva York", region: "Estados Unidos", lat: 40.7128, lon: -74.006 },
    { name: "Ciudad de México", region: "México", lat: 19.4326, lon: -99.1332 },
    { name: "Buenos Aires", region: "Argentina", lat: -34.6037, lon: -58.3816 },
    { name: "Tokio", region: "Japón", lat: 35.6762, lon: 139.6503 }
  ];
  var wx = { city: PRESETS[0], unit: "C" };
  var ws = load("startpage-weather");
  if (ws && ws.city && typeof ws.city.lat === "number" && typeof ws.city.lon === "number") {
    wx.city = { name: String(ws.city.name || "").slice(0, 80), region: String(ws.city.region || "").slice(0, 80), lat: ws.city.lat, lon: ws.city.lon };
    if (ws.unit === "F") wx.unit = "F";
  }
  function saveWx() { store("startpage-weather", wx); }

  var ICONS = {
    sun: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M18.7 5.3l-1.6 1.6M6.9 17.1l-1.6 1.6"/></svg>',
    moon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>',
    cloud: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 18h10a4 4 0 0 0 .6-7.95A5.5 5.5 0 0 0 7 9.5 4.3 4.3 0 0 0 7 18z"/></svg>',
    rain: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 15h10a3.5 3.5 0 0 0 .5-6.96A5 5 0 0 0 7.6 7.6 3.7 3.7 0 0 0 7 15z"/><path d="M9 18.5l-1 2M13 18.5l-1 2M17 18.5l-1 2"/></svg>',
    snow: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v18M4.2 7.5l15.6 9M19.8 7.5l-15.6 9"/></svg>',
    storm: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 14h10a3.5 3.5 0 0 0 .5-6.96A5 5 0 0 0 7.6 6.6 3.7 3.7 0 0 0 7 14z"/><path d="M12.5 14l-2 3.5h3l-2 3.5"/></svg>',
    fog: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 9h16M6 13h12M4 17h16"/></svg>'
  };
  function describe(code, isDay) {
    if (code === 0) return isDay ? ["sun", "Despejado"] : ["moon", "Despejado"];
    if (code <= 2) return isDay ? ["sun", "Poco nuboso"] : ["moon", "Poco nuboso"];
    if (code === 3) return ["cloud", "Nublado"];
    if (code === 45 || code === 48) return ["fog", "Niebla"];
    if (code >= 51 && code <= 57) return ["rain", "Llovizna"];
    if ((code >= 61 && code <= 67) || (code >= 80 && code <= 82)) return ["rain", "Lluvia"];
    if ((code >= 71 && code <= 77) || code === 85 || code === 86) return ["snow", "Nieve"];
    if (code >= 95) return ["storm", "Tormenta"];
    return ["cloud", "Nublado"];
  }
  function conv(c) { return Math.round(wx.unit === "F" ? c * 9 / 5 + 32 : c); }

  var lastData = null;
  function renderWx() {
    $("wxCity").textContent = wx.city.name;
    $("uC").setAttribute("aria-pressed", String(wx.unit === "C"));
    $("uF").setAttribute("aria-pressed", String(wx.unit === "F"));
    var d = lastData;
    var iconEl = $("wxIcon");
    if (!d) {
      iconEl.innerHTML = ""; iconEl.className = "wx-icon";
      $("wxTemp").textContent = "--°"; $("wxRange").textContent = "";
      $("wxDesc").textContent = "Sin datos del tiempo";
      return;
    }
    var ic = describe(d.code, d.isDay);
    iconEl.className = "wx-icon ic-" + ic[0];
    iconEl.innerHTML = ICONS[ic[0]];
    $("wxTemp").textContent = conv(d.temp) + "°" + wx.unit;
    var r = $("wxRange"); r.textContent = "";
    var hi = document.createElement("span"); hi.textContent = "↑" + conv(d.max) + "°";
    var lo = document.createElement("span"); lo.textContent = "↓" + conv(d.min) + "°";
    r.appendChild(hi); r.appendChild(lo);
    var when = "";
    if (d.at && d.live === false) {
      when = " · guardado " + new Date(d.at).toLocaleTimeString("es-ES", { hour: "2-digit", minute: "2-digit" });
    }
    $("wxDesc").textContent = ic[1] + when;
  }

  function key(c) { return c.lat.toFixed(3) + "," + c.lon.toFixed(3); }
  function cacheGet() {
    var all = load("startpage-weather-cache") || {};
    return all[key(wx.city)] || null;
  }
  function cachePut(d) {
    var all = load("startpage-weather-cache") || {};
    all[key(wx.city)] = d; store("startpage-weather-cache", all);
  }
  var reqId = 0;
  function fetchWx() {
    var id = ++reqId;
    var cached = cacheGet();
    lastData = cached ? Object.assign({}, cached, { live: false }) : null;
    renderWx();
    var url = "https://api.open-meteo.com/v1/forecast?latitude=" + wx.city.lat + "&longitude=" + wx.city.lon +
      "&current=temperature_2m,weather_code,is_day&daily=temperature_2m_max,temperature_2m_min&timezone=auto&forecast_days=1";
    var p;
    try { p = fetch(url).then(function (r) { if (!r.ok) throw new Error("http"); return r.json(); }); }
    catch (e) { p = Promise.reject(e); }
    p.then(function (j) {
      if (id !== reqId) return;
      var d = {
        temp: j.current.temperature_2m, code: j.current.weather_code, isDay: !!j.current.is_day,
        max: j.daily.temperature_2m_max[0], min: j.daily.temperature_2m_min[0], at: Date.now(), live: true
      };
      cachePut(d); lastData = d; renderWx();
      $("wxNote").textContent = "";
    }).catch(function () {
      if (id !== reqId) return;
      $("wxNote").textContent = "No se pudo consultar el tiempo desde esta vista. Si abres la página guardada en tu ordenador, se actualiza sola.";
    });
  }

  var wxCard = $("weather"), wxBtn = $("wxBtn"), wxSearch = $("wxSearch"), wxResults = $("wxResults");
  function pick(c) {
    wx.city = { name: c.name, region: c.region || "", lat: c.lat, lon: c.lon };
    saveWx(); wxSearch.value = ""; showResults(PRESETS);
    wxCard.classList.remove("open"); wxBtn.setAttribute("aria-expanded", "false");
    fetchWx();
  }
  function showResults(list) {
    wxResults.textContent = "";
    list.forEach(function (c) {
      var b = document.createElement("button"); b.type = "button";
      b.textContent = c.name;
      if (c.region) { var s = document.createElement("span"); s.textContent = c.region; b.appendChild(s); }
      b.addEventListener("click", function () { pick(c); });
      wxResults.appendChild(b);
    });
    if (!list.length) { var e = document.createElement("div"); e.className = "wx-note"; e.style.padding = "6px 8px"; e.textContent = "Sin resultados."; wxResults.appendChild(e); }
  }
  function norm(s) { return s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, ""); }
  var searchTimer, searchId = 0;
  wxSearch.addEventListener("input", function () {
    var q = wxSearch.value.trim();
    clearTimeout(searchTimer);
    if (!q) { showResults(PRESETS); return; }
    var nq = norm(q);
    var local = PRESETS.filter(function (c) { return norm(c.name).indexOf(nq) >= 0; });
    showResults(local);
    if (q.length < 2) return;
    var id = ++searchId;
    searchTimer = setTimeout(function () {
      var p;
      try {
        p = fetch("https://geocoding-api.open-meteo.com/v1/search?count=8&language=es&name=" + encodeURIComponent(q))
          .then(function (r) { return r.json(); });
      } catch (e) { return; }
      p.then(function (j) {
        if (id !== searchId) return;
        var found = (j.results || []).map(function (r) {
          return { name: r.name, region: [r.admin1, r.country].filter(Boolean).join(", "), lat: r.latitude, lon: r.longitude };
        });
        showResults(found.length ? found : local);
      }).catch(function () {});
    }, 300);
  });
  wxBtn.addEventListener("click", function () {
    var open = wxCard.classList.toggle("open");
    wxBtn.setAttribute("aria-expanded", String(open));
    if (open) { showResults(PRESETS); wxSearch.focus(); }
  });
  $("uC").addEventListener("click", function () { wx.unit = "C"; saveWx(); renderWx(); });
  $("uF").addEventListener("click", function () { wx.unit = "F"; saveWx(); renderWx(); });

  /* ---------------- Settings panel + search bar ---------------- */
  var panel = $("panel"), fab = $("fab");
  fab.addEventListener("click", function () {
    var open = panel.classList.toggle("open");
    fab.setAttribute("aria-expanded", String(open));
  });
  [["opt24", "h24"], ["optSec", "sec"], ["optDate", "date"]].forEach(function (m) {
    var el = $(m[0]); el.checked = state[m[1]];
    el.addEventListener("change", function () { state[m[1]] = el.checked; store("startpage-clock", state); tick(); });
  });
  document.addEventListener("keydown", function (e) {
    if (e.key !== "Escape") return;
    panel.classList.remove("open"); fab.setAttribute("aria-expanded", "false");
    clock.classList.remove("open"); zoneBtn.setAttribute("aria-expanded", "false");
    wxCard.classList.remove("open"); wxBtn.setAttribute("aria-expanded", "false");
  });
  $("searchForm").addEventListener("submit", function (e) {
    e.preventDefault();
    var v = $("q").value.trim();
    if (!v) return;
    var url;
    if (/^https?:\/\//i.test(v)) url = v;
    else if (/^[^\s\/]+\.[a-z]{2,}(\/\S*)?$/i.test(v)) url = "https://" + v;
    else url = "https://www.google.com/search?q=" + encodeURIComponent(v);
    var a = document.createElement("a");
    a.href = url; a.target = "_blank"; a.rel = "noopener noreferrer";
    document.body.appendChild(a); a.click(); a.remove();
  });

  fillSelect(""); tick(); schedule();
  showResults(PRESETS); fetchWx();
  setInterval(fetchWx, 15 * 60 * 1000);
})();
</script>
